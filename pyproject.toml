[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contract-rag"
version = "0.1.0"
description = "Logique métier RAG pour l'exploitation des contrats de travaux (IAP – Études & Projets)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.1",
    "psycopg-pool>=3.1",
    "httpx>=0.25",
    "openpyxl>=3.1",
    "python-docx>=1.0",
]

[project.optional-dependencies]
# Dépendances lourdes, uniquement dans l'image d'ingestion
ingest = [
    "pdfplumber>=0.10",
    "pypdfium2>=4.20",
    "pytesseract>=0.3.10",
    "Pillow>=10",
]
dev = ["pytest>=8"]

[project.scripts]
contract-rag = "contract_rag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
contract_rag = ["db/migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
